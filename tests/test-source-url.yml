name: Test install from an explicit source-url
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          diagnostic-endpoint: ""
          source-url: https://install.determinate.systems/nix-installer/stable/x86_64-linux
          nix-installer-url: https://install.determinate.systems/nix-installer/stable/x86_64-linux
      - name: Assert nix works
        run: |
          if ! command -v nix >/dev/null 2>&1; then
            echo "FAIL: nix not found on PATH"
            exit 1
          fi
          nix --version
          RESULT="$(nix eval --expr '3 + 4')"
          echo "result: $RESULT"
          if [ "$RESULT" != "7" ]; then
            echo "FAIL: expected 7"
            exit 1
          fi
          echo "PASS"
