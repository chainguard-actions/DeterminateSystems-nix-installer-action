name: Test source-revision fetches nix-installer for a specific commit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: prep
        name: Resolve the commit of the latest nix-installer release
        env:
          TOKEN: ${{ github.token }}
        run: |
          API=https://api.github.com/repos/DeterminateSystems/nix-installer
          TAG="$(curl -fsSL -H "Authorization: Bearer $TOKEN" "$API/releases/latest" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          SHA="$(curl -fsSL -H "Authorization: Bearer $TOKEN" "$API/commits/$TAG" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          echo "tag: $TAG sha: $SHA"
          if [ "${#SHA}" -ne 40 ]; then echo "FAIL: could not resolve sha"; exit 1; fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      # Per-revision artifacts are only published for some commits, so the
      # download may legitimately 404; a successful run must yield working nix.
      - id: action
        uses: .
        continue-on-error: true
        with:
          determinate: "false"
          kvm: "false"
          summarize: "false"
          diagnostic-endpoint: ""
          source-revision: ${{ steps.prep.outputs.sha }}
      - name: Assert install succeeded or failed cleanly on missing artifact
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if ! command -v nix >/dev/null 2>&1; then
              echo "FAIL: action succeeded but nix not on PATH"
              exit 1
            fi
            VERSION="$(nix --version)"
            echo "nix version: $VERSION"
            case "$VERSION" in
              *nix*) echo "PASS" ;;
              *) echo "FAIL: unexpected nix --version output"; exit 1 ;;
            esac
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: no artifact published for this revision; action failed cleanly"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
