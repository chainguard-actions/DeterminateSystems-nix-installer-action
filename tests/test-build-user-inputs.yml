name: Test nix build user configuration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          nix-build-group-id: "3000"
          nix-build-group-name: "nixbld"
          nix-build-user-base: "30000"
          nix-build-user-count: "32"
          nix-build-user-prefix: "nixbld"
          diagnostic-endpoint: ""
          github-token: ${{ github.token }}
      - name: Assert action ran (installation may fail in act environment)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with build user inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
