name: Test macOS-only options are rejected on Linux
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          diagnostic-endpoint: ""
          summarize: false
          mac-encrypt: "true"
          mac-case-sensitive: "true"
          mac-volume-label: "Nix Store"
          mac-root-disk: "disk1"
      - name: Assert the action failed because mac options are invalid on Linux
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when mac-* options are set on Linux"
            exit 1
          fi
          echo "PASS"
