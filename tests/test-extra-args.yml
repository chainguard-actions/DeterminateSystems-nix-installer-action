name: Test extra-args are passed to the installer
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          determinate: "false"
          kvm: "false"
          summarize: "false"
          diagnostic-endpoint: ""
          extra-args: --nix-build-user-prefix xbldargs
      - name: Assert nix installed
        run: |
          if ! command -v nix >/dev/null 2>&1; then
            echo "FAIL: nix not found on PATH"
            exit 1
          fi
          nix --version
          echo "PASS"
      - name: Assert build users created with prefix from extra-args
        run: |
          getent passwd | grep '^xbldargs' || true
          COUNT="$(getent passwd | grep -c '^xbldargs' || true)"
          echo "count: $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "FAIL: no build users with prefix xbldargs (extra-args not honored)"
            exit 1
          fi
          echo "PASS"
