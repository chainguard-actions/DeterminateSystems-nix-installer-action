name: Test network and package inputs (nix-package-url, proxy, ssl-cert-file)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a fake SSL cert file for testing
        run: |
          mkdir -p /tmp/fake-certs
          # Create a minimal self-signed cert for testing input passing
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/fake-certs/key.pem \
            -out /tmp/fake-certs/cert.pem -days 1 -nodes \
            -subj "/CN=test" 2>/dev/null || \
          echo "-----BEGIN CERTIFICATE-----
          MIICpDCCAYwCCQDU+pQ4pHgSpDANBgkqhkiG9w0BAQsFADAUMRIwEAYDVQQDDAl0
          ZXN0LWNlcnQwHhcNMjMwMTAxMDAwMDAwWhcNMjQwMTAxMDAwMDAwWjAUMRIwEAYD
          VQQDDAl0ZXN0LWNlcnQwggEiMA0GCSqGSIb3DQEBAQUAA4IBDwAwggEKAoIBAQC7
          -----END CERTIFICATE-----" > /tmp/fake-certs/cert.pem
      - id: action
        uses: .
        continue-on-error: true
        with:
          nix-package-url: ""
          proxy: ""
          ssl-cert-file: "/tmp/fake-certs/cert.pem"
          diagnostic-endpoint: ""
          github-token: ${{ github.token }}
      - name: Assert action ran (installation may fail in act environment)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with network/package inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
