name: Test source-binary runs an on-disk installer
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake nix-installer binary on disk
        run: |
          set -eu
          SUDO=""
          if [ "$(id -u)" != "0" ]; then SUDO="sudo"; fi
          $SUDO mkdir -p /run/systemd/system || true
          rm -rf /tmp/fake-nix-installer /tmp/fake-bin
          mkdir -p /tmp/fake-bin
          cat > /tmp/fake-bin/nix-installer <<'EOF'
          #!/bin/sh
          LOG=/tmp/fake-nix-installer
          mkdir -p "$LOG"
          echo "$0" > "$LOG/argv0"
          printf '%s\n' "$@" > "$LOG/args"
          env | grep -E '^(NIX_INSTALLER_[A-Z_]*|RUST_BACKTRACE)=' | sort > "$LOG/env" || true
          if [ ! -d /run/systemd/system ]; then
            SUDO=""
            if [ "$(id -u)" != "0" ]; then SUDO="sudo"; fi
            $SUDO mkdir -p /nix/var/nix/profiles/default/bin /usr/local/bin
            for d in /nix/var/nix/profiles/default/bin/nix-daemon /usr/local/bin/determinate-nixd; do
              $SUDO sh -c "printf '#!/bin/sh\nmkdir -p /nix/var/nix/daemon-socket\ntouch /nix/var/nix/daemon-socket/socket\nexec sleep 3\n' > $d"
              $SUDO chmod 755 "$d"
            done
          fi
          echo "fake nix-installer invoked: $*"
          exit 0
          EOF
          chmod 755 /tmp/fake-bin/nix-installer
      - id: action
        uses: .
        with:
          source-binary: /tmp/fake-bin/nix-installer
          determinate: "false"
          kvm: "false"
          summarize: "false"
      - name: Assert source-binary was executed
        run: |
          set -u
          [ -f /tmp/fake-nix-installer/argv0 ] || { echo "FAIL: source-binary not invoked"; exit 1; }
          cat /tmp/fake-nix-installer/argv0
          cat /tmp/fake-nix-installer/args
          if ! grep -qxF '/tmp/fake-bin/nix-installer' /tmp/fake-nix-installer/argv0; then
            echo "FAIL: unexpected installer path"; exit 1
          fi
          if [ "$(sed -n 1p /tmp/fake-nix-installer/args)" != "install" ]; then
            echo "FAIL: expected 'install' subcommand"; exit 1
          fi
          echo "PASS"
