name: Test deprecated nix-installer-branch input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          determinate: "false"
          kvm: "false"
          summarize: "false"
          diagnostic-endpoint: ""
          nix-installer-branch: main
      - name: Assert nix installed
        run: |
          if ! command -v nix >/dev/null 2>&1; then
            echo "FAIL: nix not found on PATH"
            exit 1
          fi
          VERSION="$(nix --version)"
          echo "nix version: $VERSION"
          case "$VERSION" in
            *nix*) echo "PASS" ;;
            *) echo "FAIL: unexpected nix --version output"; exit 1 ;;
          esac
