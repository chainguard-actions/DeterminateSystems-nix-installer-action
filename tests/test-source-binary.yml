name: Test source-binary input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a fake nix-installer binary for testing
        run: |
          mkdir -p /tmp/fake-nix-installer
          cat > /tmp/fake-nix-installer/nix-installer-x86_64-linux << 'EOF'
          #!/bin/sh
          echo "Fake nix-installer called with args: $@"
          exit 0
          EOF
          chmod +x /tmp/fake-nix-installer/nix-installer-x86_64-linux
      - id: action
        uses: .
        continue-on-error: true
        with:
          source-binary: "/tmp/fake-nix-installer"
          diagnostic-endpoint: ""
          github-token: ${{ github.token }}
      - name: Assert action ran (installation may fail in act environment)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with source-binary input"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
