name: Test Nix installation with extra-conf
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake systemd and fake nix-installer binary
        run: |
          # Create /run/systemd/system so the action believes systemd is present.
          # This keeps forceNoSystemd=false so the post step does not try to
          # read a daemon PID file that was never written.
          sudo mkdir -p /run/systemd/system

          # Create a fake nix-installer binary so the action does not need to
          # download anything from the internet. The binary just exits 0.
          FAKE_DIR="$GITHUB_WORKSPACE/tests/fake-installer"
          mkdir -p "$FAKE_DIR"
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64)  PLATFORM="x86_64-linux"  ;;
            aarch64) PLATFORM="aarch64-linux" ;;
            arm64)   PLATFORM="aarch64-linux" ;;
            *)       PLATFORM="${ARCH}-linux"  ;;
          esac
          BINARY="$FAKE_DIR/nix-installer-${PLATFORM}"
          printf '#!/bin/sh\necho "fake nix-installer: $*"\nexit 0\n' > "$BINARY"
          chmod +x "$BINARY"
          echo "FAKE_INSTALLER_DIR=$FAKE_DIR" >> "$GITHUB_ENV"
          echo "Created fake binary: $BINARY"

      - id: install
        uses: .
        continue-on-error: true
        with:
          determinate: false
          diagnostic-endpoint: ""
          trust-runner-user: true
          github-token: ${{ github.token }}
          summarize: false
          local-root: ${{ env.FAKE_INSTALLER_DIR }}
          extra-conf: |
            max-jobs = 2
            cores = 1

      - name: Assert action ran with extra-conf (success or graceful failure)
        env:
          OUTCOME: ${{ steps.install.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with extra-conf"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (environment may not support Nix installation)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
