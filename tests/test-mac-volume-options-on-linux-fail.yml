name: Test macOS volume options are rejected on Linux before running the installer
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Create a fake nix-installer binary root
        run: |
          FAKE_ROOT="$RUNNER_TEMP/fake-nix-installer-root"
          mkdir -p "$FAKE_ROOT"
          cat > "$FAKE_ROOT/nix-installer-x86_64-linux" <<'EOF'
          #!/bin/bash
          mkdir -p /tmp/fake-nix-installer
          printf '%s\n' "$@" >> /tmp/fake-nix-installer/args
          exit 0
          EOF
          chmod 755 "$FAKE_ROOT/nix-installer-x86_64-linux"
          cp "$FAKE_ROOT/nix-installer-x86_64-linux" "$FAKE_ROOT/nix-installer-aarch64-linux"
          echo "FAKE_ROOT=$FAKE_ROOT" >> "$GITHUB_ENV"
      - id: case_sensitive
        uses: .
        continue-on-error: true
        with:
          determinate: false
          kvm: false
          local-root: ${{ env.FAKE_ROOT }}
          mac-case-sensitive: "true"
      - id: root_disk
        uses: .
        continue-on-error: true
        with:
          determinate: false
          kvm: false
          local-root: ${{ env.FAKE_ROOT }}
          mac-root-disk: disk1
      - id: volume_label
        uses: .
        continue-on-error: true
        with:
          determinate: false
          kvm: false
          local-root: ${{ env.FAKE_ROOT }}
          mac-volume-label: Nix Store
      - name: Assert every macOS-only option failed and installer never ran
        env:
          O1: ${{ steps.case_sensitive.outcome }}
          O2: ${{ steps.root_disk.outcome }}
          O3: ${{ steps.volume_label.outcome }}
        run: |
          echo "mac-case-sensitive outcome: $O1"
          echo "mac-root-disk outcome: $O2"
          echo "mac-volume-label outcome: $O3"
          for o in "$O1" "$O2" "$O3"; do
            if [ "$o" != "failure" ]; then
              echo "FAIL: expected failure for macOS-only option on Linux, got '$o'"
              exit 1
            fi
          done
          if [ -f /tmp/fake-nix-installer/args ]; then
            echo "FAIL: installer should not have been executed"
            cat /tmp/fake-nix-installer/args
            exit 1
          fi
          echo "PASS"
