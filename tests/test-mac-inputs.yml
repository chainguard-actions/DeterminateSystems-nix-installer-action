name: Test macOS-specific inputs (mac-case-sensitive, mac-encrypt, mac-root-disk, mac-volume-label)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          mac-case-sensitive: "false"
          mac-encrypt: "false"
          mac-root-disk: "/dev/disk1"
          mac-volume-label: "Nix"
          diagnostic-endpoint: ""
          github-token: ${{ github.token }}
      - name: Assert action ran (installation may fail in act environment)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with mac inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
