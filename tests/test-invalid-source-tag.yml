name: Test install fails with a nonexistent source-tag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          diagnostic-endpoint: ""
          summarize: false
          source-tag: v0.0.0-actionchain-does-not-exist
          nix-installer-tag: v0.0.0-actionchain-does-not-exist
      - name: Assert the action failed to fetch the installer
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for a nonexistent source-tag"
            exit 1
          fi
          echo "PASS"
