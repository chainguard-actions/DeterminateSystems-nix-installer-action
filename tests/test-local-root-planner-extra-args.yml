name: Test planner, init and extra-args are passed to the installer
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake nix-installer binaries in a local root
        run: |
          set -eu
          SUDO=""
          if [ "$(id -u)" != "0" ]; then SUDO="sudo"; fi
          $SUDO mkdir -p /run/systemd/system || true
          rm -rf /tmp/fake-nix-installer /tmp/fake-root
          mkdir -p /tmp/fake-root
          cat > /tmp/fake-root/nix-installer-x86_64-linux <<'EOF'
          #!/bin/sh
          LOG=/tmp/fake-nix-installer
          mkdir -p "$LOG"
          echo "$0" > "$LOG/argv0"
          printf '%s\n' "$@" > "$LOG/args"
          env | grep -E '^(NIX_INSTALLER_[A-Z_]*|RUST_BACKTRACE)=' | sort > "$LOG/env" || true
          if [ ! -d /run/systemd/system ]; then
            SUDO=""
            if [ "$(id -u)" != "0" ]; then SUDO="sudo"; fi
            $SUDO mkdir -p /nix/var/nix/profiles/default/bin /usr/local/bin
            for d in /nix/var/nix/profiles/default/bin/nix-daemon /usr/local/bin/determinate-nixd; do
              $SUDO sh -c "printf '#!/bin/sh\nmkdir -p /nix/var/nix/daemon-socket\ntouch /nix/var/nix/daemon-socket/socket\nexec sleep 3\n' > $d"
              $SUDO chmod 755 "$d"
            done
          fi
          echo "fake nix-installer invoked: $*"
          exit 0
          EOF
          cp /tmp/fake-root/nix-installer-x86_64-linux /tmp/fake-root/nix-installer-aarch64-linux
          chmod 755 /tmp/fake-root/*
      - id: action
        uses: .
        with:
          local-root: /tmp/fake-root
          kvm: "false"
          summarize: "false"
          planner: linux
          init: none
          extra-args: "--no-start-daemon --custom-flag custom-value"
      - name: Assert installer args
        run: |
          set -u
          ARGS=/tmp/fake-nix-installer/args
          [ -f "$ARGS" ] || { echo "FAIL: fake installer not invoked"; exit 1; }
          echo "--- args ---"; cat "$ARGS"
          if [ "$(sed -n 1p "$ARGS")" != "install" ]; then
            echo "FAIL: arg 1 should be 'install'"; exit 1
          fi
          if [ "$(sed -n 2p "$ARGS")" != "linux" ]; then
            echo "FAIL: arg 2 should be planner 'linux'"; exit 1
          fi
          for a in --no-start-daemon --custom-flag custom-value --determinate; do
            if ! grep -qxF -- "$a" "$ARGS"; then
              echo "FAIL: missing arg '$a'"; exit 1
            fi
          done
          echo "PASS"
      - name: Assert init env
        run: |
          cat /tmp/fake-nix-installer/env
          if ! grep -qxF "NIX_INSTALLER_INIT=none" /tmp/fake-nix-installer/env; then
            echo "FAIL: expected NIX_INSTALLER_INIT=none"; exit 1
          fi
          echo "PASS"
