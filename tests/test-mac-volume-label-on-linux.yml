name: Test mac-volume-label rejected on Linux
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake nix-installer binaries in a local root
        run: |
          set -eu
          rm -rf /tmp/fake-nix-installer /tmp/fake-root
          mkdir -p /tmp/fake-root
          printf '#!/bin/sh\nmkdir -p /tmp/fake-nix-installer\nprintf "%%s\\n" "$@" > /tmp/fake-nix-installer/args\nexit 0\n' > /tmp/fake-root/nix-installer-x86_64-linux
          cp /tmp/fake-root/nix-installer-x86_64-linux /tmp/fake-root/nix-installer-aarch64-linux
          chmod 755 /tmp/fake-root/*
      - id: action
        uses: .
        continue-on-error: true
        with:
          local-root: /tmp/fake-root
          determinate: "false"
          kvm: "false"
          summarize: "false"
          mac-volume-label: Nix Store Test
      - name: Assert action failed and installer not run
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when mac-volume-label is set on Linux"
            exit 1
          fi
          if [ -f /tmp/fake-nix-installer/args ]; then
            echo "FAIL: installer should not have been executed"
            exit 1
          fi
          echo "PASS"
