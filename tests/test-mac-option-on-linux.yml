name: Test macOS-only option rejected on Linux
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          determinate: false
          kvm: false
          summarize: false
          mac-encrypt: "true"
          _internal-strict-mode: true
      - name: Assert action failed and Nix was not installed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when mac-encrypt is set on Linux"
            exit 1
          fi
          if [ -f /nix/receipt.json ]; then
            echo "FAIL: Nix should not have been installed"
            exit 1
          fi
          echo "PASS"
