name: Test install fails with an invalid nix-package-url behind an unreachable proxy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          determinate: false
          diagnostic-endpoint: ""
          summarize: false
          kvm: false
          nix-package-url: "https://install.determinate.systems/this-path-does-not-exist/nix.tar.xz"
          proxy: "http://127.0.0.1:9"
      - name: Assert the install failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with an invalid nix-package-url"
            exit 1
          fi
          echo "PASS"
