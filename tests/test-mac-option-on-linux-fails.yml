name: Test macOS-only option fails on Linux
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: action
        uses: .
        continue-on-error: true
        with:
          determinate: false
          kvm: false
          mac-encrypt: "true"
      - name: Assert action failed due to mac-encrypt on Linux
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when mac-encrypt is set on Linux"
            exit 1
          fi
          if [ -x /nix/var/nix/profiles/default/bin/nix ]; then
            echo "FAIL: nix should not have been installed"
            exit 1
          fi
          echo "PASS"
