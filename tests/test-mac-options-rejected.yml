name: Test macOS volume options rejected on Linux
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: case_sensitive
        uses: .
        continue-on-error: true
        with:
          determinate: false
          kvm: false
          summarize: false
          mac-case-sensitive: "true"
          _internal-strict-mode: true
      - id: root_disk
        uses: .
        continue-on-error: true
        with:
          determinate: false
          kvm: false
          summarize: false
          mac-root-disk: disk1
          _internal-strict-mode: true
      - id: volume_label
        uses: .
        continue-on-error: true
        with:
          determinate: false
          kvm: false
          summarize: false
          mac-volume-label: Nix Store
          _internal-strict-mode: true
      - name: Assert every macOS-only option failed and Nix was not installed
        env:
          O1: ${{ steps.case_sensitive.outcome }}
          O2: ${{ steps.root_disk.outcome }}
          O3: ${{ steps.volume_label.outcome }}
        run: |
          echo "mac-case-sensitive: $O1"
          echo "mac-root-disk: $O2"
          echo "mac-volume-label: $O3"
          for o in "$O1" "$O2" "$O3"; do
            if [ "$o" != "failure" ]; then
              echo "FAIL: expected failure for macOS-only option on Linux, got '$o'"
              exit 1
            fi
          done
          if [ -f /nix/receipt.json ]; then
            echo "FAIL: Nix should not have been installed"
            exit 1
          fi
          echo "PASS"
