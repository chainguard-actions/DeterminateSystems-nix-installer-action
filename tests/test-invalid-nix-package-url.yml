name: Test unreachable nix-package-url (via proxy) fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          determinate: false
          kvm: false
          summarize: false
          nix-package-url: https://releases.nixos.org/nix/nix-0.0.0-does-not-exist/nix-0.0.0-x86_64-linux.tar.xz
          proxy: http://127.0.0.1:9
          _internal-strict-mode: true
      - name: Assert action failed and Nix was not installed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with an unreachable nix-package-url"
            exit 1
          fi
          if command -v nix >/dev/null 2>&1 && nix --version >/dev/null 2>&1; then
            echo "FAIL: nix should not be usable"
            exit 1
          fi
          echo "PASS"
