name: Test macOS-only option rejected on Linux
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          determinate: "false"
          kvm: "false"
          mac-encrypt: "true"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when mac-encrypt is set on Linux"
            exit 1
          fi
          echo "PASS"
      - name: Assert Nix was not installed
        run: |
          if [ -f /nix/receipt.json ]; then
            echo "FAIL: /nix/receipt.json exists; install should not have run"
            exit 1
          fi
          echo "PASS"
