name: Test local-root overrides deprecated nix-installer-* inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake nix-installer binaries in a local root
        run: |
          set -eu
          SUDO=""
          if [ "$(id -u)" != "0" ]; then SUDO="sudo"; fi
          $SUDO mkdir -p /run/systemd/system || true
          rm -rf /tmp/fake-nix-installer /tmp/fake-root
          mkdir -p /tmp/fake-root
          cat > /tmp/fake-root/nix-installer-x86_64-linux <<'EOF'
          #!/bin/sh
          LOG=/tmp/fake-nix-installer
          mkdir -p "$LOG"
          echo "$0" > "$LOG/argv0"
          printf '%s\n' "$@" > "$LOG/args"
          env | grep -E '^(NIX_INSTALLER_[A-Z_]*|RUST_BACKTRACE)=' | sort > "$LOG/env" || true
          if [ ! -d /run/systemd/system ]; then
            SUDO=""
            if [ "$(id -u)" != "0" ]; then SUDO="sudo"; fi
            $SUDO mkdir -p /nix/var/nix/profiles/default/bin /usr/local/bin
            for d in /nix/var/nix/profiles/default/bin/nix-daemon /usr/local/bin/determinate-nixd; do
              $SUDO sh -c "printf '#!/bin/sh\nmkdir -p /nix/var/nix/daemon-socket\ntouch /nix/var/nix/daemon-socket/socket\nexec sleep 3\n' > $d"
              $SUDO chmod 755 "$d"
            done
          fi
          echo "fake nix-installer invoked: $*"
          exit 0
          EOF
          cp /tmp/fake-root/nix-installer-x86_64-linux /tmp/fake-root/nix-installer-aarch64-linux
          chmod 755 /tmp/fake-root/*
      - id: action
        uses: .
        with:
          local-root: /tmp/fake-root
          determinate: "false"
          kvm: "false"
          summarize: "false"
          nix-installer-tag: v0.0.0-does-not-exist
          nix-installer-branch: does-not-exist
          nix-installer-pr: "999999999"
          nix-installer-revision: 0000000000000000000000000000000000000000
          nix-installer-url: https://example.invalid/nix-installer.sh
      - name: Assert local-root binary was used instead of legacy source download
        run: |
          set -u
          [ -f /tmp/fake-nix-installer/argv0 ] || { echo "FAIL: fake installer not invoked"; exit 1; }
          cat /tmp/fake-nix-installer/argv0
          if ! grep -q '^/tmp/fake-root/nix-installer-' /tmp/fake-nix-installer/argv0; then
            echo "FAIL: installer not run from local-root"; exit 1
          fi
          echo "PASS"
